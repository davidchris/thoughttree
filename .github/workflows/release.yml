name: Release

on:
  push:
    tags:
      - 'v*'
  # A pull request that changes the release path, or a manual run, builds the DMG without publishing it.
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/build-dmg.sh
      - scripts/build-gpui.sh
      - scripts/build-sidecar.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build macOS DMG
    runs-on: macos-latest
    outputs:
      dmg: ${{ steps.dmg.outputs.name }}
    # No caches: a release builds from a clean state.
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          no-cache: true
      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Claude adapter
        run: bun run build:sidecar

      - name: Build application bundle
        run: ./scripts/build-gpui.sh

      - name: Package DMG
        id: dmg
        # On a tag, the script fails before packaging when the tag differs from the bundle version.
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            dmg="$(./scripts/build-dmg.sh --tag "$GITHUB_REF_NAME")"
          else
            dmg="$(./scripts/build-dmg.sh)"
          fi
          echo "path=$dmg" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$dmg")" >> "$GITHUB_OUTPUT"

      - name: Upload DMG
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.dmg.outputs.name }}
          path: ${{ steps.dmg.outputs.path }}
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.dmg }}

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DMG: ${{ needs.build.outputs.dmg }}
        run: >-
          gh release create "$GITHUB_REF_NAME" "$DMG"
          --verify-tag
          --title "ThoughtTree $GITHUB_REF_NAME"
          --notes "See [CHANGELOG.md]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/CHANGELOG.md) for the changes in this release."
