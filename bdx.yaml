version: 1
beads:
    path: .beads
sbx:
    template: docker.io/library/bdx-codex-bun-rust:v1
codex:
    model: gpt-5.6-sol
    reasoningEffort: medium
review:
    mode: local
    checkpoint: beforeFinalize
    scope: owningBranch
    maxCycles: 2
    onExhausted: stop
    blockOn:
        - high
        - unspecified
    belowBlockOn: defer
    reviewer:
        agent: codex
        model: gpt-5.6-sol
        reasoningEffort: high
worktreeRoot:
    policy: sibling
    path: ../thoughttree-bdx-worktrees
provision:
    commands:
        - name: bun install
          argv: [bash, -lc, "bun install --frozen-lockfile || (sleep 5 && bun install --frozen-lockfile)"]
verification:
    commands:
        - name: test
          argv: [bash, -lc, "bun install && bun run test:run"]
        - name: build
          argv: [bash, -lc, "bun run build"]
output:
    progress: normal
runPolicy:
    idleTimeout: 30m
    maxRuntime: 2h
cleanup:
    sandbox: onFailure
    worktree: onSuccess
finalize:
    upstream: origin/main
skills:
    - tdd
    - clean
    - diagnosing-bugs
