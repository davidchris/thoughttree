[package]
name = "thoughttree-core"
version = "0.4.1"
edition = "2021"
rust-version = "1.89"
license-file = "LICENSE"

[dependencies]
agent-client-protocol = { version = "2", features = ["unstable"] }
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
fs2 = "0.4.3"
futures = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
imagesize = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "process", "io-util", "time"] }
tokio-util = { version = "0.7", features = ["compat"] }
tracing = "0.1"
url = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
filetime = "0.2"
tempfile = "3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
