[package]
name = "thoughttree-gpui"
version = "0.5.0"
edition = "2021"
publish = false
description = "Native GPUI desktop frontend for ThoughtTree"

[dependencies]
gpui = { version = "=0.2.2", features = ["runtime_shaders"] }
gpui-component = { version = "=0.5.1", features = ["tree-sitter-languages"] }
gpui-component-assets = "=0.5.1"
thoughttree-core = { path = "../thoughttree-core" }
thoughttree-gpui-model = { path = "../thoughttree-gpui-model" }
thoughttree-desktop = { path = "../thoughttree-desktop" }
anyhow = "1"
async-channel = "2"
base64 = "0.22"
chrono = "0.4"
futures = "0.3"
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
markdown = "1"
mermaid-rs-renderer = { version = "0.3.1", default-features = false }
mathjax-svg-rs = "0.4"
url = "2"
roxmltree = "0.20"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
ureq = "3.4"
smol = "2"

[dev-dependencies]
gpui = { version = "=0.2.2", features = ["test-support"] }
tempfile = "3"
