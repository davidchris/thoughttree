<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Tidy layouts · ThoughtTree</title>
    <link rel="icon" href="../logo-mark.svg" />
    <link rel="stylesheet" href="../tokens.css" />
    <style>
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: var(--tt-bg);
        color: var(--tt-text);
        font: 400 var(--tt-size-sm) / var(--tt-leading) var(--tt-font);
        -webkit-font-smoothing: antialiased;
        display: grid;
        grid-template-columns: 264px 1fr;
        grid-template-rows: 100vh;
      }
      button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
      button:focus-visible { outline: none; box-shadow: var(--tt-focus); border-radius: var(--tt-radius-sm); }
      kbd {
        font: var(--tt-size-xs) var(--tt-mono);
        background: var(--tt-surface-2);
        border: var(--tt-border) solid var(--tt-line);
        border-radius: var(--tt-radius-sm);
        padding: 1px 6px;
        color: var(--tt-text-muted);
      }

      /* ---------- rail ---------- */
      .rail {
        background: var(--tt-surface);
        border-right: var(--tt-border) solid var(--tt-line);
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .masthead { padding: var(--tt-s5) var(--tt-s5) var(--tt-s4); }
      .mark { display: flex; align-items: center; gap: var(--tt-s2); color: var(--tt-text-muted); font-weight: 600; }
      .mark svg { width: 20px; height: 20px; color: var(--tt-accent); }
      .masthead h1 {
        font-size: var(--tt-size-xl);
        line-height: var(--tt-leading-tight);
        font-weight: 600;
        margin: var(--tt-s5) 0 var(--tt-s2);
        letter-spacing: -0.01em;
      }
      .lede { color: var(--tt-text-muted); margin: 0; }
      .rail-label {
        font-size: var(--tt-size-xs);
        color: var(--tt-text-faint);
        padding: var(--tt-s4) var(--tt-s5) var(--tt-s2);
        border-bottom: var(--tt-border) solid var(--tt-line);
      }
      .graphs { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; }
      .graphs button {
        display: block;
        width: 100%;
        text-align: left;
        padding: var(--tt-s3) var(--tt-s5);
        border-bottom: var(--tt-border) solid var(--tt-line);
        transition: background var(--tt-fast) var(--tt-ease);
      }
      .graphs button:hover { background: var(--tt-surface-2); }
      .graphs button[aria-current='true'] { background: var(--tt-accent-soft); }
      .graphs .name { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .graphs .facts { display: block; font-size: var(--tt-size-xs); color: var(--tt-text-faint); font-variant-numeric: tabular-nums; }
      .graphs .tag { color: var(--tt-text-muted); }
      .keys {
        padding: var(--tt-s4) var(--tt-s5);
        border-top: var(--tt-border) solid var(--tt-line);
        color: var(--tt-text-faint);
        font-size: var(--tt-size-xs);
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 6px var(--tt-s3);
        align-items: center;
      }

      /* ---------- main ---------- */
      .main { display: grid; grid-template-rows: auto 1fr; min-width: 0; min-height: 0; }

      .board { border-bottom: var(--tt-border) solid var(--tt-line); }
      .board table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
      .board th {
        text-align: left;
        font-weight: 400;
        font-size: var(--tt-size-xs);
        color: var(--tt-text-faint);
        padding: var(--tt-s3) var(--tt-s4) var(--tt-s2);
        border-bottom: var(--tt-border) solid var(--tt-line);
        white-space: nowrap;
      }
      .board th.num, .board td.num { text-align: right; }
      .board td {
        padding: 7px var(--tt-s4);
        color: var(--tt-text-muted);
        border-bottom: var(--tt-border) solid var(--tt-line);
        white-space: nowrap;
      }
      .board tr:last-child td { border-bottom: 0; }
      .board tbody tr { cursor: pointer; transition: background var(--tt-fast) var(--tt-ease); }
      .board tbody tr:hover { background: var(--tt-surface); }
      .board tbody tr[aria-selected='true'] { background: var(--tt-accent-soft); }
      .board .style { display: flex; align-items: center; gap: var(--tt-s3); color: var(--tt-text); font-weight: 600; }
      .board .style svg { color: var(--tt-accent); flex-shrink: 0; }
      .board .hint { color: var(--tt-text-faint); font-weight: 400; }
      .board .best { color: var(--tt-text); font-weight: 600; }
      .board .key { font-size: var(--tt-size-xs); color: var(--tt-text-faint); width: 1%; }

      .fit { display: flex; align-items: center; gap: var(--tt-s3); min-width: 220px; }
      .fit .track { flex: 1; height: 4px; background: var(--tt-line); border-radius: 2px; overflow: hidden; }
      .fit .bar {
        display: block;
        height: 100%;
        background: var(--tt-text-faint);
        border-radius: 2px;
        transition: width var(--tt-base) var(--tt-ease), background var(--tt-base) var(--tt-ease);
      }
      .fit.best .bar { background: var(--tt-text); }
      .fit .value { width: 3.5em; text-align: right; }

      /* ---------- stage ---------- */
      .stage {
        min-height: 0;
        overflow: auto;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
        grid-auto-rows: minmax(360px, 1fr);
      }
      .stage.focus { grid-template-columns: 1fr; grid-auto-rows: 1fr; overflow: hidden; }
      .cell {
        display: grid;
        grid-template-rows: auto 1fr;
        min-height: 0;
        position: relative;
        border-right: var(--tt-border) solid var(--tt-line);
        border-bottom: var(--tt-border) solid var(--tt-line);
      }
      .focus .cell { border: 0; }
      .cell header {
        display: flex;
        align-items: center;
        gap: var(--tt-s2);
        padding: var(--tt-s3) var(--tt-s4);
        color: var(--tt-text-muted);
      }
      .cell header svg { color: var(--tt-accent); }
      .cell header .name { color: var(--tt-text); font-weight: 600; }
      .cell header .meta { margin-left: auto; font-size: var(--tt-size-xs); color: var(--tt-text-faint); font-variant-numeric: tabular-nums; }
      .cell header button { color: var(--tt-text-faint); font-size: var(--tt-size-xs); padding: 2px 6px; border-radius: var(--tt-radius-sm); }
      .cell header button:hover { color: var(--tt-text); background: var(--tt-surface-2); }
      .canvas { width: 100%; height: 100%; display: block; min-height: 0; cursor: zoom-in; }
      .focus .canvas { cursor: grab; }
      .focus .canvas.panning { cursor: grabbing; }

      .trail {
        position: absolute;
        left: var(--tt-s4);
        bottom: var(--tt-s4);
        max-width: min(60ch, calc(100% - 2 * var(--tt-s4)));
        padding: var(--tt-s2) var(--tt-s3);
        background: var(--tt-surface);
        border: var(--tt-border) solid var(--tt-line);
        border-radius: var(--tt-radius);
        color: var(--tt-text-muted);
        font-size: var(--tt-size-xs);
        opacity: 0;
        transition: opacity var(--tt-base) var(--tt-ease);
        pointer-events: none;
      }
      .trail.shown { opacity: 1; }
      .trail strong { color: var(--tt-text); font-weight: 600; }

      /* ---------- graph marks, in the canvas grammar ---------- */
      .edge, .node rect { vector-effect: non-scaling-stroke; }
      .edge { fill: none; stroke: var(--tt-edge); stroke-width: 1.5; transition: stroke var(--tt-base) var(--tt-ease), opacity var(--tt-base) var(--tt-ease); }
      .edge.lineage { stroke: color-mix(in srgb, var(--tt-accent) 70%, var(--tt-edge)); stroke-width: 2; }
      .node { cursor: pointer; }
      .node rect {
        fill: var(--tt-surface);
        stroke: var(--tt-line);
        stroke-width: 1;
        transition: stroke var(--tt-base) var(--tt-ease), fill var(--tt-base) var(--tt-ease);
      }
      .node:hover rect { stroke: var(--tt-line-strong); }
      .node.lineage rect { stroke: color-mix(in srgb, var(--tt-accent) 50%, var(--tt-line)); fill: color-mix(in srgb, var(--tt-accent) 8%, var(--tt-surface)); }
      .node.selected rect { stroke: var(--tt-accent); stroke-width: 2; }
      .node .dot { fill: var(--tt-accent); }
      .node.assistant .dot { fill: none; stroke: var(--tt-accent); stroke-width: 2; }
      .node .role { fill: var(--tt-text-muted); font-size: 12px; }
      .node .file-tag { fill: var(--tt-text-muted); font: 11px var(--tt-mono); }
      .node .text { fill: var(--tt-text-muted); font-size: 13px; }
      .node.selected .text, .node.lineage .text { fill: var(--tt-text); }
      .has-selection .edge:not(.lineage) { opacity: 0.45; }
      .has-selection .node:not(.lineage, .selected) { opacity: 0.7; }
      .node { transition: opacity var(--tt-base) var(--tt-ease); }

      .empty { display: grid; place-items: center; color: var(--tt-text-faint); }
    </style>
  </head>
  <body>
    <aside class="rail">
      <div class="masthead">
        <div class="mark">
          <svg viewBox="0 0 32 32" aria-hidden="true">
            <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <line x1="16" y1="6" x2="8" y2="15" /><line x1="16" y1="6" x2="24" y2="15" />
              <line x1="8" y1="15" x2="16" y2="24" /><line x1="24" y1="15" x2="16" y2="24" />
              <circle cx="8" cy="15" r="3" /><circle cx="24" cy="15" r="3" /><circle cx="16" cy="24" r="3" />
            </g>
            <circle cx="16" cy="6" r="3.5" fill="currentColor" />
          </svg>
          ThoughtTree
        </div>
        <h1>Tidy layouts</h1>
        <p class="lede">Five ways to arrange the same conversations. Click a node to trace everything that feeds into it.</p>
      </div>
      <div class="rail-label">Graphs</div>
      <ul class="graphs" id="graphs"></ul>
      <div class="keys">
        <kbd>1–5</kbd><span>Show one layout</span>
        <kbd>0</kbd><span>Compare all</span>
        <kbd>↑ ↓</kbd><span>Previous or next graph</span>
        <kbd>Esc</kbd><span>Clear selection</span>
      </div>
    </aside>
    <div class="main">
      <section class="board" aria-label="Layout scores">
        <table>
          <thead>
            <tr>
              <th class="key"></th>
              <th>Layout</th>
              <th title="Zoom at which the whole graph fits a 1440×900 canvas. Higher means a better overview.">Overview at 1440×900</th>
              <th class="num" title="Pairs of edges that cross">Crossings</th>
              <th class="num" title="Edges drawn behind a node that is not one of their ends">Behind nodes</th>
              <th class="num" title="Mean edge length, centre to centre">Edge length</th>
              <th class="num">Time</th>
            </tr>
          </thead>
          <tbody id="board"></tbody>
        </table>
      </section>
      <main class="stage" id="stage"></main>
    </div>
    <script type="module" src="./gallery.ts"></script>
  </body>
</html>
