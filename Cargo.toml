[workspace]
members = ["crates/thoughttree-core", "crates/thoughttree-gpui-model", "crates/thoughttree-desktop", "crates/thoughttree-gpui", "src-tauri"]
resolver = "2"

[profile.release]
lto = true
strip = true
codegen-units = 1
panic = "abort"

[profile.dev]
incremental = true

[profile.dev.package."*"]
opt-level = 2
