[workspace]
members = ["crates/thoughttree-core", "crates/thoughttree-gpui-model", "crates/thoughttree-desktop", "crates/thoughttree-gpui"]
resolver = "2"

# One version for every crate: the app, and what it reports to adapters and web servers.
[workspace.package]
version = "0.7.1"

[profile.release]
lto = true
strip = true
codegen-units = 1
panic = "abort"

[profile.dev]
incremental = true

[profile.dev.package."*"]
opt-level = 2
